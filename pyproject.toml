[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-knife"
dynamic = ["version"]
description = "HuggingFace model management for MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "mlxk2/NOTICE"]
authors = [
    {name = "The BROKE team", email = "broke@gmx.eu"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = [
    # Core
    "huggingface-hub>=1.0.0",
    "requests>=2.32.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    # MLX stack (Text + Vision + Audio).
    # Upper bounds are hygiene per ADR-023: every upstream minor bump gets an
    # explicit compatibility check + release bump, never an implicit upgrade
    # on `pip install`. Loosen only with a new mlx-knife release that has
    # re-verified the integration.
    # The bound is 0.32.1, not 0.33: measured 2026-08-27 against the pinned
    # mlx-vlm 0.6.10, same command and model each time (Qwen2-VL-7B-Instruct-4bit,
    # one image, temperature 0) —
    #   0.32.0  exit 0, correct description
    #   0.32.1  exit 134 — output correct, then `Fatal Python error:
    #           PyThreadState_Get ... GIL is released` while finalizing
    #   0.32.2  exit 1  — TypeError in the vision tower before inference:
    #           `mx.tile(stacked_pos_ids, (t, 1))` with an array-derived tuple
    # Both failures are the same class (mx.array used where an int is expected),
    # which upstream fixed in mlx-vlm 0.6.16 (#1982) and 0.6.17 (#2021) — versions
    # this release does not take. Scope, measured at 0.32.2 only: the text path and
    # non-MRoPE vision (pixtral) came through unaffected there. 0.32.1's abort was
    # not scoped that way — it is excluded on its own failure, not by analogy.
    # Condition to loosen: an mlx-vlm that carries those fixes, re-measured here.
    "mlx>=0.30.0,<0.32.1",
    "mlx-lm==0.31.3",
    # Held at 0.4.4 from 2026-08-03 to 2026-08-27: 0.4.6's PR #825 moved resampling
    # out of the Kaiser-windowed-sinc `mlx_audio.utils.resample_audio` into
    # miniaudio's decoder, whose stopband is far too shallow for an ASR front-end.
    # Reported as mlx-audio#870, fixed by PR #872 the next day, shipped in 0.4.8.
    #
    # Re-measured 2026-08-27 through the real entry point `stt.utils.load_audio`,
    # 44.1k -> 16k, faded tones with the filter transient trimmed. 0.4.8 is not
    # merely within tolerance, it is identical to 0.4.4 to two decimals:
    #   1 kHz    pass       0.00 dB  /    0.00 dB
    #   3 kHz    pass      -0.00 dB  /   -0.00 dB
    #   8.5 kHz  remove  -102.82 dB  / -102.82 dB
    #   12 kHz   remove  -102.38 dB  / -102.38 dB
    # (The tone must be faded: a step at t=0 is broadband, and its low-frequency
    # part passes any anti-alias filter — measuring that instead reads ~-50 dB and
    # peaks at frequencies that are not the fold-over of the input.)
    #
    # The pin stays explicit rather than becoming a floor: Whisper carries a bridge
    # in audio_runner.py that an untested mlx-audio would silently slide under, and
    # mlx-vlm only asks for >=0.4.3. Condition to revisit: any release that touches
    # the load path or `Model.get_tokenizer` — the bridge canary reports the second.
    "mlx-audio==0.4.8",
    "mlx-vlm==0.6.10",
    "transformers==5.14.1",
    "tiktoken>=0.7.0,<1.0",
]

[project.scripts]
mlxk = "mlxk2.cli:main"
mlxk-json = "mlxk2.cli:main"
mlxk2 = "mlxk2.cli:main"
mlx-run = "mlxk2.tools.run:main"

[project.urls]
Homepage = "https://github.com/mzau/mlx-knife"
Repository = "https://github.com/mzau/mlx-knife"
Issues = "https://github.com/mzau/mlx-knife/issues"

[tool.setuptools.packages.find]
include = ["mlxk2*"]
exclude = ["tests*", "tests_2.0*"]

[tool.setuptools.dynamic]
version = {attr = "mlxk2.__version__"}

[project.optional-dependencies]
test = [
    "pytest>=7",
    "jsonschema>=4.20",
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    # OpenAI Python client for the embed-serve /v1/embeddings round-trip live test (ADR-015
    # Use Case 4). Developer-only: the SDK test is live (needs a running backend), kept out of
    # the lean [test] extra; the live test guards with pytest.importorskip("openai").
    "openai>=1.0",
]

[tool.ruff.lint]
# Pin the rule set to the project's own choice, not to whatever the installed
# ruff happens to default to. Without this, a ruff release can turn a green
# lint gate red on unchanged code: 0.15.16 reported 0 findings here, 0.16.0
# reported 959 — same tree, same config, wider defaults. These four are the
# state that is green today, so adopting them is a zero-diff change. Widening
# the set is a deliberate decision, made here, never a side effect of an
# upgrade — which is why `ruff` stays unpinned in [dev].
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# cli.py: HF_HOME bootstrap (ADR-022) must run before any huggingface imports
"mlxk2/cli.py" = ["E402"]

[tool.setuptools.package-data]
mlxk2 = [
  "assets/whisper/*.tiktoken",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-knife"
dynamic = ["version"]
description = "HuggingFace model management for MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "mlxk2/NOTICE"]
authors = [
    {name = "The BROKE team", email = "broke@gmx.eu"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = [
    # Core
    "huggingface-hub>=1.0.0",
    "requests>=2.32.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    # MLX stack (Text + Vision + Audio).
    # Upper bounds are hygiene per ADR-023: every upstream minor bump gets an
    # explicit compatibility check + release bump, never an implicit upgrade
    # on `pip install`. Loosen only with a new mlx-knife release that has
    # re-verified the integration.
    "mlx>=0.30.0,<0.33",
    "mlx-lm==0.31.3",
    # Pinned explicitly, even though mlx-vlm 0.6.8 currently forces 0.4.4 anyway:
    # mlx-audio >=0.4.5 caps transformers <5.13.0, which is incompatible with
    # mlx-vlm >=0.6.5. That transitive protection lasts only as long as upstream's
    # cap stands — and it is a CI pin, not a code constraint. The explicit pin
    # records what we verified; Whisper carries bridge patches in audio_runner.py
    # that an untested mlx-audio would silently slide under.
    "mlx-audio==0.4.4",
    "mlx-vlm==0.6.8",
    "transformers==5.14.1",
    "tiktoken>=0.7.0,<1.0",
]

[project.scripts]
mlxk = "mlxk2.cli:main"
mlxk-json = "mlxk2.cli:main"
mlxk2 = "mlxk2.cli:main"
mlx-run = "mlxk2.tools.run:main"

[project.urls]
Homepage = "https://github.com/mzau/mlx-knife"
Repository = "https://github.com/mzau/mlx-knife"
Issues = "https://github.com/mzau/mlx-knife/issues"

[tool.setuptools.packages.find]
include = ["mlxk2*"]
exclude = ["tests*", "tests_2.0*"]

[tool.setuptools.dynamic]
version = {attr = "mlxk2.__version__"}

[project.optional-dependencies]
test = [
    "pytest>=7",
    "jsonschema>=4.20",
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    # OpenAI Python client for the embed-serve /v1/embeddings round-trip live test (ADR-015
    # Use Case 4). Developer-only: the SDK test is live (needs a running backend), kept out of
    # the lean [test] extra; the live test guards with pytest.importorskip("openai").
    "openai>=1.0",
]

[tool.ruff.lint]
# Pin the rule set to the project's own choice, not to whatever the installed
# ruff happens to default to. Without this, a ruff release can turn a green
# lint gate red on unchanged code: 0.15.16 reported 0 findings here, 0.16.0
# reported 959 — same tree, same config, wider defaults. These four are the
# state that is green today, so adopting them is a zero-diff change. Widening
# the set is a deliberate decision, made here, never a side effect of an
# upgrade — which is why `ruff` stays unpinned in [dev].
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# cli.py: HF_HOME bootstrap (ADR-022) must run before any huggingface imports
"mlxk2/cli.py" = ["E402"]

[tool.setuptools.package-data]
mlxk2 = [
  "assets/whisper/*.tiktoken",
]
